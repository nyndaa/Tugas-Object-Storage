<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f9fafb">

    <title>Login | InspoPic</title>
    <meta
        name="description"
        content="Masuk atau daftar untuk menyimpan inspirasi gambar di InspoPic."
    >

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body class="min-h-screen bg-gray-50 text-gray-900">

    <!-- Dekorasi latar belakang -->
    <div class="pointer-events-none fixed inset-0 overflow-hidden">
        <div class="absolute -right-24 -top-24 h-80 w-80 rounded-full bg-red-100/60 blur-3xl"></div>
        <div class="absolute -bottom-24 -left-24 h-80 w-80 rounded-full bg-gray-200/60 blur-3xl"></div>
    </div>

    <!-- Konten utama -->
    <main class="relative flex min-h-screen items-center justify-center px-4 py-10">

        <!-- Kartu autentikasi -->
        <section class="w-full max-w-md rounded-3xl border border-gray-100 bg-white p-6 shadow-xl shadow-gray-200/60 sm:p-9">

            <!-- Logo -->
            <a
                href="/index.html"
                class="mb-8 flex items-center justify-center gap-2 text-2xl font-extrabold tracking-tight text-gray-900"
            >
                <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-red-600 text-lg text-white">
                    <i class="fa-regular fa-images"></i>
                </span>

                InspoPic<span class="text-red-600">.</span>
            </a>

            <!-- Judul -->
            <div class="mb-8 text-center">
                <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-red-50 text-xl text-red-600">
                    <i class="fa-solid fa-user"></i>
                </div>

                <h1
                    id="auth-title"
                    class="text-2xl font-bold tracking-tight text-gray-900 sm:text-3xl"
                >
                    Selamat Datang!
                </h1>

                <p
                    id="auth-subtitle"
                    class="mt-3 text-sm leading-6 text-gray-500"
                >
                    Masuk untuk menemukan dan menyimpan inspirasi favoritmu.
                </p>
            </div>

            <!-- Form autentikasi -->
            <form id="auth-form" class="space-y-5">

                <!-- Username -->
                <div class="space-y-2">
                    <label
                        for="username"
                        class="block text-sm font-semibold text-gray-700"
                    >
                        Username
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-red-400 focus:bg-white focus:ring-2 focus:ring-red-100"
                    >

                    <p class="text-xs text-gray-400">
                        Digunakan saat membuat akun baru.
                    </p>
                </div>

                <!-- Email -->
                <div class="space-y-2">
                    <label
                        for="email"
                        class="block text-sm font-semibold text-gray-700"
                    >
                        Email
                    </label>

                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="nama@email.com"
                            autocomplete="email"
                            required
                            class="w-full rounded-xl border border-gray-200 bg-gray-50 py-3 pl-11 pr-4 text-sm text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-red-400 focus:bg-white focus:ring-2 focus:ring-red-100"
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label
                        for="password"
                        class="block text-sm font-semibold text-gray-700"
                    >
                        Password
                    </label>

                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Masukkan password"
                            minlength="8"
                            autocomplete="current-password"
                            required
                            class="w-full rounded-xl border border-gray-200 bg-gray-50 py-3 pl-11 pr-4 text-sm text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-red-400 focus:bg-white focus:ring-2 focus:ring-red-100"
                        >
                    </div>
                </div>

                <!-- Pesan autentikasi -->
                <p
                    id="auth-message"
                    role="status"
                    aria-live="polite"
                    class="hidden rounded-xl bg-red-50 px-4 py-3 text-sm leading-6 text-red-700"
                ></p>

                <!-- Tombol aksi -->
                <div class="space-y-3 pt-2">
                    <button
                        id="login-button"
                        type="button"
                        class="inline-flex w-full items-center justify-center gap-2 rounded-full bg-red-600 px-6 py-3 font-semibold text-white shadow-sm transition hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-2"
                    >
                        <i class="fa-solid fa-right-to-bracket"></i>
                        Login
                    </button>

                    <button
                        id="register-button"
                        type="button"
                        class="inline-flex w-full items-center justify-center gap-2 rounded-full border border-gray-200 bg-white px-6 py-3 font-semibold text-gray-700 transition hover:border-red-200 hover:bg-red-50 hover:text-red-600 focus:outline-none focus:ring-2 focus:ring-red-200 focus:ring-offset-2"
                    >
                        <i class="fa-solid fa-user-plus"></i>
                        Daftar Akun
                    </button>
                </div>
            </form>

            <!-- Footer kartu -->
            <div class="mt-8 border-t border-gray-100 pt-5 text-center">
                <a
                    href="/index.html"
                    class="inline-flex items-center gap-2 text-sm text-gray-500 transition hover:text-red-600"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    Kembali ke beranda
                </a>

                <p class="mt-4 text-xs text-gray-400">
                    Temukan ide. Simpan inspirasi. Berkreasi.
                </p>
            </div>

        </section>
    </main>

    <!-- JavaScript autentikasi -->
    <script src="/js/auth.js"></script>

</body>
</html>
